<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxed With Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Parisienne&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbe4ec; --panel:#fffbfc; --ink:#3b2432; --muted:#9a6b81; --line:#eab7cb;
  --accent:#d6668f; --accent-ink:#ffffff;
  --font:Quicksand,system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:Parisienne,"Segoe Script",cursive;
  --hand:Caveat,"Segoe Script","Bradley Hand",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a1620; --panel:#3a2030; --ink:#f5e4ee; --muted:#c99bb3; --line:#6b3550;
    --accent:#ef8fb1; --accent-ink:#2a1620;
  }
}
:root[data-theme="dark"]{
  --bg:#2a1620; --panel:#3a2030; --ink:#f5e4ee; --muted:#c99bb3; --line:#6b3550;
  --accent:#ef8fb1; --accent-ink:#2a1620;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--font)}
main{max-width:560px;margin:0 auto;padding:22px 18px 56px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

h2{font:700 .95rem/1.2 var(--font);color:var(--muted);text-transform:lowercase;letter-spacing:.02em;margin:0 0 14px}
.sub{text-align:center;color:var(--muted);margin:0 0 6px}
.sub.small{font-size:.85rem;margin-top:8px}
.small{color:var(--muted);font-size:.9rem;margin:8px 0 0}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
section{margin-top:22px}

/* --- header --- */
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.brand .logo{font:400 clamp(2.1rem,8vw,2.7rem)/1 var(--script);color:var(--ink)}
.brand-img{height:48px;width:auto;object-fit:contain;border-radius:4px}
.brand svg{width:32px;height:32px;color:var(--accent);flex:none}

/* --- box stage --- */
.stage{position:relative;display:flex;justify-content:center;align-items:center;width:100%;background:none;border:0;padding:0;cursor:pointer;color:inherit;outline:none;}
.stage svg{display:block;width:min(300px,78vw);height:auto;margin:0 auto;overflow:visible}
.stage.big svg{width:min(380px,86vw)}
.lid{transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-origin:40px 200px}
.peek{transition:transform .8s .15s ease-out;transform:translateY(72px)}
.cast{transition:opacity .3s}
svg.open .lid{transform:translate(-14px,-82px) rotate(-9deg)}
svg.open .peek{transform:translateY(0)}
svg.open .cast{opacity:0}
.spark{position:absolute;left:50%;top:32%;font-size:20px;opacity:0;pointer-events:none}
.burst .spark{animation:sp 1.3s ease-out forwards;animation-delay:var(--d)}
@keyframes sp{
  0%{opacity:0;transform:translate(-50%,0) scale(.4)}
  25%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.2)}
}
@keyframes shake{
  0%,100%{transform:rotate(0) translateX(0)}
  15%{transform:rotate(-5deg) translateX(-4px)}
  30%{transform:rotate(4deg) translateX(3px)}
  45%{transform:rotate(-4deg) translateX(-3px)}
  60%{transform:rotate(3deg) translateX(2px)}
  75%{transform:rotate(-2deg) translateX(-1px)}
}
.stage.shaking svg{animation:shake .55s ease-in-out}
.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
.confetti{position:absolute;left:50%;top:40%;font-size:22px;opacity:0;animation:confetti-fly var(--dur) cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d)}
@keyframes confetti-fly{
  0%{opacity:0;transform:translate(-50%,0) rotate(0) scale(.5)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot)) scale(1.05)}
}

/* --- layout: box on the left, cards on the right (wide screens) --- */
.top-grid{display:grid;gap:18px;margin-top:22px}
@media (min-width:760px){
  main{max-width:920px}
  .top-grid{grid-template-columns:270px 1fr;align-items:start}
}
.stack{display:flex;flex-direction:column;gap:18px}

/* --- pink dotted card --- */
.frame,.card{
  position:relative;background:var(--panel);border:1.5px dashed var(--line);border-radius:16px;
  background-image:radial-gradient(var(--line) .7px,transparent .7px);
  background-size:12px 12px;background-position:-4px -4px;
}
.frame{padding:18px 14px 14px;text-align:center}
.card{padding:18px 20px}

/* --- to/from --- */
.tofrom{display:flex;flex-direction:column}
.scriptlabel{font:400 1.5rem/1 var(--script);color:var(--ink)}
.scriptinput{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;
  font:400 1.35rem/1.4 var(--script);color:var(--ink);padding:2px 2px 10px;margin-bottom:12px;outline:none}
.scriptinput::placeholder{color:var(--muted);font-family:var(--font);font-size:.8rem;font-weight:600}
.scriptinput:focus{border-color:var(--accent)}

/* --- color pickers: wheel + rectangle swatches --- */
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.clabel{width:58px;flex:none;font:600 .85rem var(--font);color:var(--muted)}
.wheel{position:relative;width:30px;height:30px;flex:none;border-radius:50%;overflow:hidden;cursor:pointer;
  background:conic-gradient(#f44,#fc3,#5d5,#3cf,#55f,#e4e,#f44);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.wheel.on::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--cur);box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.wheel input{position:absolute;inset:0;opacity:0;cursor:pointer;border:0;padding:0;width:100%;height:100%}
.wheel:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.wheel.sm{width:24px;height:24px}
.wheel.sm.on::after{inset:5px}
.rectsw{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:150px}
.rectsw-item{width:32px;height:23px;border-radius:6px;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.rectsw-item[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.rectsw-item.sm{width:24px;height:19px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 .82rem var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.btn{padding:11px 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 .92rem var(--font);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1;min-width:0}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:600 .95rem var(--font)}
input[type=file]{width:100%;font:inherit;color:var(--muted)}

/* --- sticker picker (decorates the box itself) --- */
.stickerpick{display:flex;flex-wrap:wrap;gap:8px}
.stickerbtn{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel);
  font-size:21px;cursor:pointer;display:grid;place-items:center;line-height:1}
.stickerbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}

/* --- flower picker & bouquet --- */
.flowerpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.flowerbtn{display:grid;justify-items:center;gap:4px;padding:12px 4px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--panel);cursor:pointer;font:700 .72rem var(--font);color:var(--muted)}
.flowerbtn .fe{font-size:28px}
.flowerbtn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, var(--panel));color:var(--ink)}
.flowercard{display:grid;justify-items:center;gap:6px;width:min(220px,82%);margin:0 auto;padding:30px 20px 22px;
  border-radius:50% 50% 10% 10% / 62% 62% 10% 10%;box-shadow:0 10px 20px rgba(0,0,0,.18)}

.femoji{display:flex;justify-content:center;align-items:flex-end;min-height:2.5em;margin-top:10px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.femoji span { display: inline-block; transform-origin: bottom center; transition: transform .3s ease; font-size: inherit; }

/* Çapraz Buket - 2 flowers */
.femoji span:first-child:nth-last-child(2) { transform: rotate(-15deg); margin-right: -0.2em; }
.femoji span:first-child:nth-last-child(2) ~ span:nth-child(2) { transform: rotate(15deg); margin-left: -0.2em; }

/* Çapraz Buket - 3 flowers */
.femoji span:first-child:nth-last-child(3) { transform: rotate(-25deg); margin-right: -0.3em; }
.femoji span:first-child:nth-last-child(3) ~ span:nth-child(2) { transform: rotate(0deg); z-index: 3; }
.femoji span:first-child:nth-last-child(3) ~ span:nth-child(3) { transform: rotate(25deg); margin-left: -0.3em; }

/* Çapraz Buket - 4 flowers */
.femoji span:first-child:nth-last-child(4) { transform: rotate(-30deg); margin-right: -0.3em; }
.femoji span:first-child:nth-last-child(4) ~ span:nth-child(2) { transform: rotate(-10deg); z-index: 3; }
.femoji span:first-child:nth-last-child(4) ~ span:nth-child(3) { transform: rotate(10deg); z-index: 2; margin-left: -0.2em;}
.femoji span:first-child:nth-last-child(4) ~ span:nth-child(4) { transform: rotate(30deg); margin-left: -0.3em; }

/* Çapraz Buket - 5+ flowers */
.femoji span:first-child:nth-last-child(n+5),
.femoji span:first-child:nth-last-child(n+5) ~ span { margin: 0 -0.2em; }
.femoji span:first-child:nth-last-child(n+5) { transform: rotate(-35deg); }
.femoji span:first-child:nth-last-child(n+5) ~ span:nth-child(2) { transform: rotate(-15deg); z-index: 3; }
.femoji span:first-child:nth-last-child(n+5) ~ span:nth-child(3) { transform: rotate(0deg); z-index: 4; }
.femoji span:first-child:nth-last-child(n+5) ~ span:nth-child(4) { transform: rotate(15deg); z-index: 2; }
.femoji span:first-child:nth-last-child(n+5) ~ span:nth-child(5) { transform: rotate(35deg); z-index: 1; }
.femoji span:first-child:nth-last-child(n+5) ~ span:nth-child(6) { transform: rotate(45deg); z-index: 0; }
.femoji span:only-child { transform: rotate(0deg); margin: 0; }

.flabel{font:700 .85rem var(--font);color:#5a4350}

/* --- location card --- */
.place{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;background:var(--panel);
  border:1.5px solid var(--line);border-radius:12px 12px 12px 2px;box-shadow:0 8px 18px rgba(0,0,0,.14)}
.place .pin{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.place .pin svg{width:22px;height:22px}
.place b{color:var(--ink)}
.place a{color:var(--accent);font-weight:700}

/* --- add-content tiles --- */
.adds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{display:grid;justify-items:center;gap:6px;padding:14px 4px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--muted);font:700 .78rem var(--font);cursor:pointer}
.stamp svg{width:26px;height:26px;color:var(--accent)}
.stamp:hover{border-color:var(--accent);color:var(--ink)}
#panel{margin-top:16px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.tools .gap{flex:1}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mini svg{width:18px;height:18px;color:var(--accent);flex:none}
.mini .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px 8px}
.pvimg{display:block;max-width:100%;max-height:220px;margin-top:12px;border-radius:4px}
textarea.link{font-size:.8rem;word-break:break-all;resize:vertical}

/* --- parchment paper (for notes/drawing, deliberately a different texture) --- */
.parchment{position:relative;isolation:isolate;width:100%;padding:22px 24px;color:#4a3420}
.parchment::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.4),transparent 55%),
    radial-gradient(ellipse at 88% 92%,rgba(120,80,30,.3),transparent 60%),
    #ecd9a8;
  filter:url(#rough);
  box-shadow:0 8px 18px rgba(50,35,10,.3);
}
.paper-input{display:block;width:100%;min-height:130px;border:0;outline:none;background:transparent;resize:vertical;padding:0;color:#4a3420;font:500 1.45rem/1.35 var(--hand)}
.paper-input::placeholder{color:#8a7350}
.note{margin:0;font:500 1.5rem/1.35 var(--hand);white-space:pre-wrap;word-break:break-word;color:#4a3420}
canvas.draw,canvas.dv{display:block;width:100%;aspect-ratio:1;touch-action:none}
canvas.draw{cursor:crosshair}
.parchment.tight{padding:14px}

/* --- recipient view --- */
.goodies{display:grid;gap:30px;margin-top:26px}
.goodie{display:flex;justify-content:center;opacity:0;transform:translateY(30px) rotate(var(--r,0deg));animation:pop .7s ease-out forwards}
@keyframes pop{to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
.polaroid{margin:0;width:min(300px,100%);background:#fdfcf8;padding:12px 12px 6px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.polaroid img{display:block;width:100%;height:auto}
.polaroid figcaption{min-height:1.8em;padding:10px 4px 4px;text-align:center;color:#3b2f2a;font:500 1.35rem/1.2 var(--hand)}
.song{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;background:var(--ink);color:var(--bg);border-radius:12px 12px 12px 2px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.song .disc{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;color:#fff;background:repeating-radial-gradient(circle,#111 0 2px,#262626 2px 4px)}
.song .disc svg{width:22px;height:22px}
.song a{color:inherit;font-weight:700}
.end{text-align:center;margin-top:34px}
.back{margin-bottom:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::as{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>

/* Confetti + balloons that pop out on the first tap, before the box actually opens */
const PARTY_PIECES = ['🎉','🎊','✨','💛','💖','⭐','🎈','🌟'];
function partyBurst(container) {
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  layer.innerHTML = Array.from({length: 22}, () => {
    const e = PARTY_PIECES[Math.floor(Math.random() * PARTY_PIECES.length)];
    const dx = Math.round((Math.random() - .5) * 340);
    const dy = -Math.round(90 + Math.random() * 190);
    const rot = Math.round((Math.random() - .5) * 420);
    const d = (Math.random() * .35).toFixed(2);
    const dur = (1.1 + Math.random() * .6).toFixed(2);
    return `<span class="confetti" style="--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;--d:${d}s;--dur:${dur}s">${e}</span>`;
  }).join('');
  container.appendChild(layer);
  setTimeout(() => layer.remove(), 2200);
}

function paint(canvas, strokes) {
  const ctx = canvas.getContext('2d');
  const k = canvas.width / LOGICAL;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, LOGICAL, LOGICAL);
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const st of strokes) {
    const p = st.p;
    ctx.strokeStyle = st.c; ctx.lineWidth = st.s;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    if (p.length === 2) ctx.lineTo(p[0] + .1, p[1]);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
    ctx.stroke();
  }
}

function shrink(file, max = 280, q = .5) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function fromB64url(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function pipe(u8, stream) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer());
}
async function decode(s) {
  let bytes = fromB64url(s.slice(1));
  if (s[0] === '1') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function sanitize(d) {
  const idx = (v, len) => Math.max(0, Math.min(len - 1, parseInt(v) || 0));
  const str = (v, n) => String(v ?? '').slice(0, n);
  const col = (v, list) => /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : (list[+v] ? list[+v].c : list[0].c);
  const out = { v:1, to:str(d.to,24), from:str(d.from,24),
    box:col(d.box, COLORS), rib:col(d.rib, RIBBONS), pat:idx(d.pat, PATTERNS.length),
    lay:idx(d.lay, LAYOUTS.length), bow:idx(d.bow, BOWS.length),
    stickers: (Array.isArray(d.stickers) ? d.stickers : []).filter(id => STICKERS.some(s => s.id === id)).slice(0, MAXSTICKERS),
    items:[] };
  for (const it of (Array.isArray(d.items) ? d.items : []).slice(0, MAX)) {
    if (!it) continue;
    if (it.t === 'note') out.items.push({ t:'note', text:str(it.text, 500) });
    else if (it.t === 'photo' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(it.src || ''))
      out.items.push({ t:'photo', src:it.src, cap:str(it.cap, 60) });
    else if (it.t === 'draw' && Array.isArray(it.strokes))
      out.items.push({ t:'draw', strokes: it.strokes.slice(0, 400).map(s => ({
        c: /^#[0-9a-f]{6}$/i.test(s.c) ? s.c : '#000000',
        s: Math.max(1, Math.min(12, +s.s || 3)),
        p: (Array.isArray(s.p) ? s.p : []).slice(0, 4000).map(n => +n || 0)
      })).filter(s => s.p.length >= 2) });
    else if (it.t === 'song') {
      const u = String(it.url || '');
      out.items.push({ t:'song', title:str(it.title, 80), url: /^https?:\/\//i.test(u) ? u.slice(0, 300) : '' });
    }
    else if (it.t === 'flower') {
      const raw = Array.isArray(it.kinds) ? it.kinds : (it.kind ? [it.kind] : []);
      const kinds = raw.filter(k => FLOWERS.some(f => f.id === k)).slice(0, 6);
      if (kinds.length) out.items.push({ t:'flower', kinds });
    }
    else if (it.t === 'location') {
      const u = String(it.url || '');
      out.items.push({ t:'location', name:str(it.name, 60), url: /^https?:\/\//i.test(u) ? u.slice(0, 300) : '' });
    }
  }
  return out;
}

function colorRow(wheelSel, listSel, list, key) {
  const wheel = $(wheelSel), listEl = $(listSel), inp =$('input', wheel);
  const cur = () => pkg[key].toLowerCase();
  listEl.innerHTML = list.map(c =>
    `<button type="button" class="rectsw-item" style="background:${c.c}" aria-label="${c.n}" data-c="${c.c}"></button>`).join('');
  const sync = () => {
    $$('.rectsw-item', listEl).forEach(b => b.setAttribute('aria-pressed', b.dataset.c === cur()));
    wheel.classList.toggle('on', !list.some(c => c.c === cur()));
    wheel.style.setProperty('--cur', pkg[key]);
    inp.value = pkg[key];
  };
  listEl.onclick = e => {
    const b = e.target.closest('.rectsw-item'); if (!b) return;
    pkg[key] = b.dataset.c; sync(); refreshBox();
  };
  inp.oninput = () => { pkg[key] = inp.value; sync(); refreshBox(); };
  sync();
}
function chips(el, list, key) {
  el.innerHTML = list.map((n, i) =>
    `<button type="button" class="chip" aria-pressed="${pkg[key] === i}" data-i="${i}">${n}</button>`).join('');
  el.onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    pkg[key] = +b.dataset.i; chips(el, list, key); refreshBox();
  };
}

  el.onclick = e => {
    const b = e.target.closest('.stickerbtn'); if (!b) return;
    const id = b.dataset.id, i = pkg.stickers.indexOf(id);
    if (i >= 0) pkg.stickers.splice(i, 1);
    else {
      if (pkg.stickers.length >= MAXSTICKERS) { msg(`You can stick up to ${MAXSTICKERS} stickers on the box.`); return; }
      pkg.stickers.push(id);
    }
    stickerPicker(el); refreshBox(); msg('');
  };
}

function closePanel() { $('#panel').innerHTML = ''; }
function addItem(it) { pkg.items.push(it); closePanel(); renderList(); msg(''); }

function openPanel(type) {
  const P = $('#panel');
  if (pkg.items.length >= MAX) { P.innerHTML = `<p class="small">The box is full — it only fits ${MAX} things. You can remove one.</p>`; return; }
  if (type === 'photo' && pkg.items.filter(i => i.t === 'photo').length >= MAXPHOTO) {
    P.innerHTML = `<p class="small">To keep the link short, you can add up to ${MAXPHOTO} photos.</p>`; return;
  }
  const actions = `<div class="row"><button type="button" class="btn" id="cancel">Cancel</button><button type="button" class="btn primary" id="ok">Add to box</button></div>`;

  if (type === 'note') {
    P.innerHTML = `<div class="parchment"><textarea id="txt" class="paper-input" maxlength="500" rows="5" placeholder="What do you want to say?" aria-label="Note"></textarea></div>` + actions;
    $('#txt').focus();
    $('#ok').onclick = () => { const t = $('#txt').value.trim(); if (t) addItem({ t:'note', text:t }); };
  }

  if (type === 'photo') {
    P.innerHTML = `<label class="f" for="file">Choose a photo</label><input id="file" type="file" accept="image/*"><div id="pv"></div>
      <label class="f" for="cap">Caption (optional)</label><input id="cap" class="inp" type="text" maxlength="60">` + actions;
    let src = ''; $('#ok').disabled = true;
    $('#file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      shrink(f).then(s => {
        src = s; $('#pv').innerHTML = `<img class="pvimg" src="${s}" alt="Your selected photo">`; $('#ok').disabled = false;
      }).catch(() => { $('#pv').textContent = 'This file could not be read, try another photo.'; });
    };
    $('#ok').onclick = () => src && addItem({ t:'photo', src, cap:$('#cap').value.trim() });
  }

  if (type === 'draw') {
    let strokes = [], col = INK[0], size = SIZES[1], cur = null;
    P.innerHTML = `<div class="tools" id="tools">
        ${INK.map((c, i) => `<button type="button" class="rectsw-item sm" style="background:${c}" data-c="${c}" aria-label="Color ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}
        <label class="wheel sm" title="Pick your own color"><input type="color" id="pen" value="${INK[0]}" aria-label="Pick your own drawing color"></label>
        <span class="gap"></span>
        ${SIZES.map((s, i) => `<button type="button" class="chip" data-s="${s}" aria-pressed="${i === 1}">${['Thin','Medium','Thick'][i]}</button>`).join('')}
      </div>
      <div class="parchment tight"><canvas id="cv" class="draw" width="600" height="600" aria-label="Drawing area"></canvas></div>
      <div class="row"><button type="button" class="btn" id="undo">Undo</button><button type="button" class="btn" id="clr">Clear</button></div>` + actions;
    const cv = $('#cv');
    const pt = e => { const r = cv.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) / r.width * LOGICAL), Math.round((e.clientY - r.top) / r.height * LOGICAL)]; };
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      cur = { c:col, s:size, p:pt(e) }; strokes.push(cur); paint(cv, strokes);
    });
    cv.addEventListener('pointermove', e => {
      if (!cur) return;
      const [x, y] = pt(e), p = cur.p, dx = x - p[p.length - 2], dy = y - p[p.length - 1];
      if (dx * dx + dy * dy < 4) return;
      p.push(x, y); paint(cv, strokes);
    });
    ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { cur = null; }));
    $('#tools').onclick = e => {       const b = e.target.closest('button'); if (!b) return;       if (b.dataset.c) { col = b.dataset.c; $$('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#pen').parentElement.classList.remove('on'); }       if (b.dataset.s) { size = +b.dataset.s; $$('[data-s]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
    };
    $('#pen').oninput = e => {       col = e.target.value; $$('[data-c]').forEach(x => x.setAttribute('aria-pressed', 'false'));
      const l = e.target.parentElement; l.classList.add('on'); l.style.setProperty('--cur', col);
    };
    $('#undo').onclick = () => { strokes.pop(); paint(cv, strokes); };
    $('#clr').onclick  = () => { strokes = []; paint(cv, strokes); };
    $('#ok').onclick   = () => strokes.length && addItem({ t:'draw', strokes });
  }

  if (type === 'song') {
    P.innerHTML = `<label class="f" for="st">Song title and artist</label><input id="st" class="inp" type="text" maxlength="80">
      <label class="f" for="su">Listen link (YouTube, Spotify… optional)</label><input id="su" class="inp" type="url" placeholder="https://">` + actions;
    $('#ok').onclick = () => {
      const title = $('#st').value.trim(); let url = $('#su').value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (title || url) addItem({ t:'song', title, url });
    };
  }

  if (type === 'flower') {
    const chosen = [];
    P.innerHTML = `<p class="small" style="margin:0 0 10px">Pick a few — they'll go in as one bouquet.</p>
      <div class="flowerpick" id="flowerpick">${FLOWERS.map(f =>
      `<button type="button" class="flowerbtn" data-id="${f.id}" aria-pressed="false"><span class="fe">${f.e}</span><span>${f.label}</span></button>`).join('')}</div>` + actions;
    $('#ok').disabled = true;
    $('#flowerpick').onclick = e => {
      const b = e.target.closest('.flowerbtn'); if (!b) return;
      const id = b.dataset.id, i = chosen.indexOf(id);
      if (i >= 0) chosen.splice(i, 1); else chosen.push(id);
      b.setAttribute('aria-pressed', i < 0 ? 'true' : 'false');
      $('#ok').disabled = chosen.length === 0;
    };
    $('#ok').onclick = () => chosen.length && addItem({ t:'flower', kinds: chosen.slice(0, 6) });
  }

  if (type === 'location') {
    P.innerHTML = `<label class="f" for="pname">Place name</label><input id="pname" class="inp" type="text" maxlength="60" placeholder="e.g. Central Park, our first café">
      <label class="f" for="purl">Map link (optional — we'll build one from the name if you skip this)</label><input id="purl" class="inp" type="url" placeholder="https://">` + actions;
    $('#ok').onclick = () => {
      const name = $('#pname').value.trim(); let url = $('#purl').value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (!url && name) url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name);
      if (name || url) addItem({ t:'location', name, url });
    };
  }
  $('#cancel').onclick = closePanel;
}

function flowerKinds(it) { return Array.isArray(it.kinds) ? it.kinds : (it.kind ? [it.kind] : []); }
function flowerLabel(it) {
  const names = flowerKinds(it).map(k => (FLOWERS.find(f => f.id === k) || {}).label).filter(Boolean);
  if (!names.length) return 'Flowers';
  return names.length > 1 ? `Bouquet (${names.join(', ')})` : names[0];
}

function renderList() {
  const label = it => it.t === 'note' ? it.text
    : it.t === 'photo' ? (it.cap || 'Photo')
    : it.t === 'draw' ? 'Drawing'
    : it.t === 'flower' ? flowerLabel(it)
    : it.t === 'location' ? (it.name || 'Location')
    : (it.title || it.url);
  $('#cnt').textContent = `(${pkg.items.length}/${MAX})`;
  $('#list').innerHTML = pkg.items.map((it, i) =>
    `<div class="mini">${ICONS[it.t]}<span class="t">${esc(label(it))}</span>
     <button type="button" class="x" data-rm="${i}" aria-label="Remove">×</button></div>`).join('');
  $('#list').onclick = e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    pkg.items.splice(+b.dataset.rm, 1); renderList();
  };
}

/* --- FIREBASE LINK CREATION --- */
async function copyText(text, input) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { input.select(); try { return document.execCommand('copy'); } catch { return false; } }
}

async function makeLink() {
  if (!pkg.items.length) return msg('Add at least one thing to the box first.');
  msg('Saving to the database, please wait…');
  $('#mkBtn').disabled = true;

  try {
    const newBoxRef = push(ref(db, 'boxes'));
    await set(newBoxRef, pkg);

    const shortId = newBoxRef.key;
    const link = location.href.split('#')[0] + '#id=' + shortId;

    $('#out').innerHTML = `
      <label class="f" for="lnk">Send to a friend (short link)</label>
      <textarea id="lnk" class="inp link" rows="2" readonly>${esc(link)}</textarea>
      <div class="row">
        <button type="button" class="btn primary" id="cp">Copy</button>
        ${navigator.share ? '<button type="button" class="btn" id="shr">Share…</button>' : ''}
      </div>`;

    $('#cp').onclick = async () => { $('#cp').textContent = (await copyText(link, $('#lnk'))) ? 'Copied' : 'Copy'; };
    if (navigator.share) $('#shr').onclick = () => navigator.share({ title:"You've got a gift box!", url:link }).catch(() => {});
    msg('Link created successfully!');
  } catch (error) {
    msg('Something went wrong. Please check your connection and try again.');
    console.error(error);
  } finally {
    $('#mkBtn').disabled = false;
  }
}

/* =========================================================
   6) RECIPIENT SCREEN: the box arrives closed, opens on tap
   ========================================================= */
function goodieHTML(it, i) {
  const rot = [-2.5, 1.8, -1.2, 2.4, -2, 1.4][i % 6];
  let inner = '';
  if (it.t === 'note')  inner = `<div class="parchment"><p class="note">${esc(it.text)}</p></div>`;
  if (it.t === 'photo') inner = `<figure class="polaroid"><img src="${it.src}" alt="Photo from the box"><figcaption>${esc(it.cap)}</figcaption></figure>`;
  if (it.t === 'draw')  inner = `<div class="parchment tight"><canvas class="dv" width="600" height="600" data-i="${i}" aria-label="Drawing"></canvas></div>`;
  if (it.t === 'song')  inner = `<div class="song"><div class="disc" aria-hidden="true">${ICONS.song}</div><div><b>${esc(it.title) || 'A song'}</b>${
    it.url ? `<br><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Listen</a>` : ''}</div></div>`;
  if (it.t === 'flower') {
    const flowers = flowerKinds(it).map(k => FLOWERS.find(f => f.id === k)).filter(Boolean);
    if (flowers.length) {
      const bg = flowers[0].bg;
      const size = flowers.length === 1 ? 66 : flowers.length <= 3 ? 56 : 42;
      const emojis = flowers.map(f => `<span>${f.e}</span>`).join('');
      const label = flowers.length > 1 ? 'Bouquet' : flowers[0].label;
      inner = `<div class="flowercard" style="background:${bg}"><div class="femoji" style="font-size:${size}px">${emojis}</div><span class="flabel">${esc(label)}</span></div>`;
    }
  }
  if (it.t === 'location') inner = `<div class="place"><div class="pin" aria-hidden="true">${ICONS.location}</div><div><b>${esc(it.name) || 'A place'}</b>${
    it.url ? `<br><a href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Open in Maps</a>` : ''}</div></div>`;
  return `<div class="goodie" style="--r:${rot}deg;animation-delay:${(i * .3).toFixed(2)}s">${inner}</div>`;
}

function renderViewer(p, opt = {}) {
  const from = p.from.trim();
  app.innerHTML = `
    ${opt.preview ? '<button type="button" class="btn back" id="back">Back to editing</button>' : ''}
    <div class="brand">
      <img src="watermarked_img_13074438334791701695.jpg" alt="Logo" class="brand-img">
      <span class="logo" style="font-size:clamp(1.7rem,6vw,2.2rem)">${from ? esc(from) + ' sent you a box' : "You\'ve got a box"}</span>
    </div>
    <p class="sub" id="hint">Tap the box to open it</p>
    <div class="frame"><button type="button" class="stage big" id="stage" aria-label="Open the box">${boxSVG(p, false)}${sparksHTML()}</button></div>
    <div class="goodies" id="goodies"></div>
    <p class="end" id="end" hidden><button type="button" class="btn primary" id="endBtn">${opt.preview ? 'Back to editing' : 'Make your own box'}</button></p>`;

  const goBack = () => { if (opt.preview) { renderBuilder(); } else { pkg = blank(); location.hash = ''; } };
  if (opt.preview) $('#back').onclick = () => renderBuilder();
  $('#endBtn').onclick = goBack;

  let step = 0; // 0 closed, 1 confetti popped, 2 open
  $('#stage').onclick = () => {
    if (step === 0) {
      step = 1;
      partyBurst($('#stage'));
      $('#stage').classList.add('shaking');
      setTimeout(() => $('#stage').classList.remove('shaking'), 550);
      $('#hint').textContent = 'Tap again to open it!';
      return;
    }
    if (step !== 1) return;
    step = 2;
    $('#stage').classList.add('shaking');
    $('#hint').textContent = 'Opening…';
    setTimeout(() => {
      $('#stage').classList.remove('shaking');
      $('#stage svg').classList.add('open'); $('#stage').classList.add('burst');
      $('#hint').textContent = "Here's what was inside";
      setTimeout(() => {
        $('#goodies').innerHTML = p.items.map(goodieHTML).join('');         $$('canvas.dv').forEach(cv => paint(cv, p.items[cv.dataset.i].strokes));$('#end').hidden = false;
        $('#goodies').scrollIntoView({ behavior:'smooth', block:'start' });
      }, 750);
    }, 550);
  };
}

function renderError() {
  app.innerHTML = `<div class="brand"><span class="logo">This link could not be opened</span></div>
    <p class="sub">The link may have been cut off or corrupted when it was copied. Try asking the sender for it again.</p>
    <p class="end"><button type="button" class="btn primary" id="mk">Make your own box</button></p>`;
  $('#mk').onclick = () => { location.hash = ''; };
}

/* =========================================================
   7) ROUTING: loads Firebase links and legacy self-contained links
   ========================================================= */
async function route() {
  // Keep supporting old, long self-contained links
  const oldUrl = location.hash.match(/^#k=(.+)$/);
  if (oldUrl) {
    try { renderViewer(sanitize(await decode(oldUrl[1]))); } catch { renderError(); }
    return;
  }

  // New short Firebase-backed links
  const m = location.hash.match(/^#id=(.+)$/);
  if (!m) { renderBuilder(); return; }

  app.innerHTML = `
    <div class="brand">
      <img src="watermarked_img_13074438334791701695.jpg" alt="Logo" class="brand-img">
      <span class="logo" style="font-size:2rem; margin-top:40px;">Opening your box…</span>
    </div>`;

  try {
    const snapshot = await get(child(ref(db), `boxes/${m[1]}`));
    if (snapshot.exists()) {
      renderViewer(sanitize(snapshot.val()));
    } else {
      renderError();
    }
  } catch (error) {
    console.error(error);
    renderError();
  }
}
addEventListener('hashchange', route);
route();
})();
</script>
